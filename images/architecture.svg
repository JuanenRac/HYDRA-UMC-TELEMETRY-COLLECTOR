<title id="t">HYDRA-UMC-TELEMETRY-COLLECTOR architecture</title>
<desc id="d">HYDRA-UMC-TELEMETRY-COLLECTOR accepts CAN and WebSocket samples over HTTP and the MQTT state of the bridges, checks them, removes duplicates, buffers them with optional priorities and a disk spool, and flushes batches to HYDRA-UMC-DATALAKE.</desc>
