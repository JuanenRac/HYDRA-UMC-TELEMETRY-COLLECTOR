name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          go-checks: strict

  coverage:
    name: Test coverage (with a floor that does not go down)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
      - name: Measure the statement coverage
        working-directory: src
        run: |
          go test -count=1 -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -40
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "COVERAGE_TOTAL=$total"
          awk -v t="$total" -v f=0 'BEGIN { if (t+0 < f+0) { print "coverage " t " is under the floor of " f; exit 1 } }'
