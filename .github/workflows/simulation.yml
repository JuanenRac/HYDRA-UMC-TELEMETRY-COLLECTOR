#
# Runs the real collector and its disk spool with a simulated fleet of robots whose producers resend, restart and fall silent, and a simulated data lake that flaps on a fixed seed. No hardware. See docs/SIMULATION.md.
# It runs on every push and pull request, by hand, and once a week.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
      - name: Run the scenarios
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          cd src
          go test -count=1 -run "TestSimulation_" -v ./collector/
